[project]
name = "persona-engine"
version = "0.1.0"
description = "41rpm Persona Engine — FastAPI wrapper around persona_agent"
requires-python = ">=3.11"

dependencies = [
    # Monorepo-local path during dev (override in Dockerfile for deploy)
    # For git deploy: "persona_agent @ git+ssh://git@github.com/kimtaeyoon83/41r-advisor.git#subdirectory=persona_agent"
    "persona_agent[browser,analysis,benchmark] @ file:///home/kimtayoon/myrepo/41r-advisor/persona_agent",

    # FastAPI stack
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.0",

    # R2 / S3-compatible uploads
    "boto3>=1.34",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",  # for TestClient
    "ruff>=0.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
